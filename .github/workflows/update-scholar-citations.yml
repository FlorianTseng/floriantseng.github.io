name: Update Google Scholar citations

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-scholar-citations.yml"
      - "scripts/update_scholar_citations.py"

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch citation count
        run: python scripts/update_scholar_citations.py

      - name: Commit updated badge data
        run: |
          if git diff --quiet -- assets/data/scholar-citations.json; then
            echo "Citation count is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar-citations.json
          git commit -m "Update Google Scholar citation count"
          git push
